name: Hyprland configuration checks

on:
  push:
    paths: ['hyprland/**', '.github/workflows/hyprland.yml']
  pull_request:
    paths: ['hyprland/**', '.github/workflows/hyprland.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find hyprland -type f -name '*.sh' -exec bash -n {} \;
      - name: Lint installation transactions
        run: shellcheck hyprland/install.sh hyprland/restore.sh
      - name: Exercise installer backup and restore in isolated temporary homes
        run: python3 -m unittest discover -s hyprland/tests -p 'test_*.py' -v
      - name: Verify read-only installation preview
        run: bash hyprland/install.sh --dry-run --vmware

  native-config:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native configuration validators
        run: pacman -Syu --noconfirm --needed hyprland fuzzel lua
      - uses: actions/checkout@v4
      - name: Create unprivileged validation account
        run: useradd --create-home --shell /bin/bash desktop-check
      - name: Parse both actual themes in a disposable home without starting a desktop
        run: runuser -u desktop-check -- bash hyprland/tests/validate_native.sh
