# Original FROST lock screen. Uses your Linux account password.
general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.config/arian-hypr/current/wallpaper.png
    color = rgb(0b1018)
    blur_passes = 0
    brightness = 0.55
}
label {
    monitor =
    text = ❄  FROST
    color = rgb(8edbff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(e3f3ff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(9db3c6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 290, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    outer_color = rgb(8edbff) rgb(b5bcff) 45deg
    inner_color = rgb(111b27)
    font_color = rgb(e3f3ff)
    check_color = rgb(b5bcff)
    fail_color = rgb(ff8c9a)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="#9db3c6">Enter password</span>
    fail_text = Try again
    fade_on_empty = false
    rounding = 14
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = Quiet hours. Clear mind.
    color = rgb(9db3c6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
