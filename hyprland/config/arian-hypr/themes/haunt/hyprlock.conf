# Original HAUNT lock screen. Uses your Linux account password.
general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.config/arian-hypr/current/wallpaper.png
    color = rgb(100d17)
    blur_passes = 0
    brightness = 0.55
}
label {
    monitor =
    text = 🎃  HAUNT
    color = rgb(ffa45c)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(f6e9ff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(bd9ccc)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 290, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    outer_color = rgb(ffa45c) rgb(c69aff) 45deg
    inner_color = rgb(1b1426)
    font_color = rgb(f6e9ff)
    check_color = rgb(c69aff)
    fail_color = rgb(ff8295)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="#bd9ccc">Enter password</span>
    fail_text = Try again
    fade_on_empty = false
    rounding = 14
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = A little midnight mischief.
    color = rgb(bd9ccc)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
