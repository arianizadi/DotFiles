# Frost / Haunt · compatibility configuration for Hyprland 0.53–0.54
# Hyprland 0.55+ should use the accompanying hyprland.lua instead.
# Personal changes belong in ~/.config/arian-hypr-local/local.conf.

monitor = , preferred, auto, 1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
    col.active_border = rgba(a9d9e8ff)
    col.inactive_border = rgba(33414fcc)
}

decoration {
    rounding = 12
    active_opacity = 1
    inactive_opacity = 1
    # Keep compositor cost modest on the VMware virtual GPU.
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = arianEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, arianEase, popin 96%
    animation = border, 1, 3, arianEase
    animation = fade, 1, 2, arianEase
    animation = workspaces, 1, 2, arianEase, fade
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = -1
}

source = ~/.config/arian-hypr/current/hyprland.conf
exec-once = "$HOME/.config/arian-hypr/scripts/session.sh"

$mainMod = SUPER
$actions = "$HOME/.config/arian-hypr/scripts/actions.sh"

bind = $mainMod, Return, exec, $actions terminal
bind = $mainMod, Space, exec, $actions launcher
bind = $mainMod, E, exec, $actions files
bind = $mainMod, W, exec, $actions browser
bind = $mainMod, V, exec, $actions clipboard
bind = $mainMod CTRL, V, exec, $actions clear-clipboard
bind = $mainMod, L, exec, $actions lock
bind = $mainMod, Escape, exec, $actions power
bind = $mainMod SHIFT, S, exec, $actions screenshot
bind = , Print, exec, $actions screenshot
bind = $mainMod, slash, exec, $actions help
bind = $mainMod, comma, exec, $actions settings
bind = $mainMod SHIFT, T, exec, "$HOME/.config/arian-hypr/scripts/theme.sh" toggle
bind = $mainMod SHIFT, R, exec, hyprctl reload

bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, Space, togglefloating,
# layoutmsg works on 0.53 and 0.54; the old togglesplit dispatcher was removed.
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# The installer creates this file if absent; keep it outside the managed tree.
source = ~/.config/arian-hypr-local/local.conf
